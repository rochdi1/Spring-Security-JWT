version: '3.8'

services:
  # 1. MySQL Database
  mysql-db:
    image: mysql:8.0
    container_name: springboot_mysql
    environment:
      MYSQL_DATABASE: auth_product_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: secure_password_123
      MYSQL_ROOT_PASSWORD: root_password_123
    ports:
      - "3306:3306"
    networks:
      - ci_network
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. SonarQube for Code Quality
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube_server
    ports:
      - "9000:9000"
    networks:
      - ci_network
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions

  # 3. Jenkins CI/CD Automation Server
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins_server
    privileged: true
    user: root
    ports:
      - "8082:8080"
      - "50000:50000"
    networks:
      - ci_network
    environment:
      - JENKINS_ADMIN_ID=admin
      - JENKINS_ADMIN_PASSWORD=${JENKINS_ROOT_PASSWORD} # Holt den Wert aus der .env
      - DOCKER_HOST=tcp://docker:2375
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

  # 4. Spring Boot Anwendungs-Dienst
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: springboot_auth_api
    ports:
      - "8080:8080"
    networks:
      - ci_network
    environment:
      # KORRIGIERT: Wechsel von PostgreSQL auf MySQL URL und Hostname
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/auth_product_db?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=app_user
      - SPRING_DATASOURCE_PASSWORD=secure_password_123
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=true
      - JWT_SECRET=3c9c3524b5e7d5904d9c3524b5e7d5904d9c3524b5e7d5904d9c3524b5e7d590
      - JWT_ACCESS_EXPIRATION=9000000 
      - JWT_REFRESH_EXPIRATION=86400000 
    depends_on:
      # KORRIGIERT: Saubere Abhängigkeit zu MySQL healthcheck
      mysql-db:
        condition: service_healthy

networks:
  ci_network:
    driver: bridge

volumes:
  mysql_data:
  jenkins_data:
  sonarqube_data:
  sonarqube_extensions:
