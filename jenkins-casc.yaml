jenkins:
  systemMessage: "Jenkins configured automatically by Jenkins Configuration as Code plugin"

  # Security Realm for user authentication
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "admin"

        - id: "developer"
          password: "developer"

        - id: "viewer"
          password: "viewer"


  # Authorization Strategy
  authorizationStrategy:
    projectMatrix:
      entries:
        - user:
            name: admin
            permissions:
              - Overall/Administer
        - user:
            name: developer
            permissions:
              - Overall/Read
              - Job/Build
        - user:
            name: viewer
            permissions:
              - Overall/Read



# Tool Configuration
tool:
  git:
    installations:
      - name: "Default"
        home: "/usr/bin/git"
  maven:
    installations:
      - name: maven3
        properties:
          - installSource:
              installers:
                - maven:
                    id: "3.8.4"
jobs:
  - script: |
      # 🚀 Job 1: Erste Pipeline
      pipelineJob('erste-beispiel-pipeline') {
          description('Das ist der erste Pipeline-Job aus JCasC.')
          definition {
              cps {
                  script('''
                      pipeline {
                          agent any
                          stages {
                              stage('Build') {
                                  steps {
                                      echo 'Building...'
                                      echo 'Kompiliere Anwendung 1...'
                                  }
                              }
                            stage('Test') {
                                steps {
                                    echo 'Testing...'
                                }
                            }
                            stage('Deploy') {
                                steps {
                                    echo 'Deploying...'
                                }
                            }
                          }
                      }
                  '''.stripIndent())
                  sandbox(true)
              }
          }
      }

      # 🚀 Job 2: Zweite Pipeline
      pipelineJob('zweite-beispiel-pipeline') {
          description('Das ist der zweite Pipeline-Job aus JCasC.')
          definition {
              cps {
                  script('''
                      pipeline {
                          agent any
                          stages {
                              stage('Test') {
                                  steps {
                                      echo 'Führe Tests für Anwendung 2 aus...'
                                  }
                              }
                          }
                      }
                  '''.stripIndent())
                  sandbox(true)
              }
          }
      }

      # 🚀 Job 3: Dritte Pipeline
      pipelineJob('zweite-beispiel-pipeline') {
          description('Das ist der dritte Pipeline-Job aus JCasC.')
          definition {
              cps {
                  script('''
                          pipeline {
                            agent any
                            
                            tools {
                                maven 'Maven3' // Must match the name configured in Jenkins Global Tool Configuration
                            }
                            
                            environment {
                                DOCKER_IMAGE = "rochdi1/jwt-security-api"
                                IMAGE_TAG = "${BUILD_NUMBER}"
                            }
                            
                            stages {
                                stage('Checkout') {
                                    steps {
                                        checkout scm
                                    }
                                }
                                
                                stage('Unit Tests') {
                                    steps {
                                        sh 'mvn clean test'
                                    }
                                }
                                
                                stage('SonarQube Quality Gate') {
                                    steps {
                                        // Ensure you have configured the SonarQube server in Jenkins settings
                                        withSonarQubeEnv('SonarQube') {
                                            sh 'mvn sonar:sonar -Dsonar.projectKey=jwt-security-api'
                                        }
                                    }
                                }
                                
                                stage('Build Docker Image') {
                                    steps {
                                        sh "docker build -t ${DOCKER_IMAGE}:${IMAGE_TAG} ."
                                        sh "docker tag ${DOCKER_IMAGE}:${IMAGE_TAG} ${DOCKER_IMAGE}:latest"
                                    }
                                }
                                
                                stage('Push to Registry') {
                                    steps {
                                        withCredentials([usernamePassword(credentialsId: 'docker-hub-credentials', usernameVariable: 'rochdi1', passwordVariable: '123456789')]) {
                                            sh "echo ${PASS} | docker login -u ${USER} --password-stdin"
                                            sh "docker push ${DOCKER_IMAGE}:${IMAGE_TAG}"
                                            sh "docker push ${DOCKER_IMAGE}:latest"
                                        }
                                    }
                                }
                                
                                stage('Deploy to Kubernetes') {
                                    steps {
                                        // Applies the deployment manifest to your Kubernetes Cluster
                                        sh "sed -i 's|IMAGE_PLACEHOLDER|${DOCKER_IMAGE}:${IMAGE_TAG}|g' k8s-deployment.yml"
                                        sh "kubectl apply -f k8s-deployment.yml"
                                    }
                                }
                            }
                        }
                  '''.stripIndent())
                  sandbox(true)
              }
          }
      }
 
