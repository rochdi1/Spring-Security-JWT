jenkins:
  systemMessage: "Jenkins configured automatically by Jenkins Configuration as Code plugin"

  # Security Realm for user authentication
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "admin"

        - id: "developer"
          password: "developer"

        - id: "viewer"
          password: "viewer"


  # Authorization Strategy
  authorizationStrategy:
    projectMatrix:
      entries:
        - user:
            name: admin
            permissions:
              - Overall/Administer
        - user:
            name: developer
            permissions:
              - Overall/Read
              - Job/Build
        - user:
            name: viewer
            permissions:
              - Overall/Read



# Tool Configuration
tool:
  git:
    installations:
      - name: "Default"
        home: "/usr/bin/git"
  maven:
    installations:
      - name: maven3
        properties:
          - installSource:
              installers:
                - maven:
                    id: "3.8.4"
jobs:
  - script: |
      # 🚀 Job 1: Erste Pipeline
      pipelineJob('erste-beispiel-pipeline') {
          description('Das ist der erste Pipeline-Job aus JCasC.')
          definition {
              cps {
                  script('''
                      pipeline {
                          agent any
                          stages {
                              stage('Build') {
                                  steps {
                                      echo 'Building...'
                                      echo 'Kompiliere Anwendung 1...'
                                  }
                              }
                            stage('Test') {
                                steps {
                                    echo 'Testing...'
                                }
                            }
                            stage('Deploy') {
                                steps {
                                    echo 'Deploying...'
                                }
                            }
                          }
                      }
                  '''.stripIndent())
                  sandbox(true)
              }
          }
      }

      # 🚀 Job 2: Zweite Pipeline
      pipelineJob('zweite-beispiel-pipeline') {
          description('Das ist der zweite Pipeline-Job aus JCasC.')
          definition {
              cps {
                  script('''
                      pipeline {
                          agent any
                          stages {
                              stage('Test') {
                                  steps {
                                      echo 'Führe Tests für Anwendung 2 aus...'
                                  }
                              }
                          }
                      }
                  '''.stripIndent())
                  sandbox(true)
              }
          }
      }

# Sample Job Configuration
